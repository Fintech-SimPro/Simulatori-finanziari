<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" style="max-width: 420px;">
    <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#198754;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Scudo geometrico di base -->
    <path d="M 50 25 L 110 25 L 130 80 L 90 135 L 50 135 Z" fill="url(#shieldGrad)" opacity="0.95" />
    <path d="M 50 25 L 90 25 L 110 80 L 70 135 L 30 80 Z" fill="url(#shieldGrad)" opacity="0.8" />
    
    <!-- Grafico a barre & Grattacielo -->
    <rect x="52" y="90" width="14" height="30" rx="3" fill="white" opacity="0.9" />
    <rect x="74" y="70" width="14" height="50" rx="3" fill="white" opacity="0.9" />
    <rect x="96" y="45" width="14" height="75" rx="3" fill="url(#accentGrad)" />

    <!-- Testo / Naming -->
    <text x="160" y="75" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#2b2d42">SimPro</text>
    
    <!-- Sottotitoli -->
    <text x="163" y="105" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0d6efd" letter-spacing="2">FINANCE &amp; REAL ESTATE</text>
    
    <text x="163" y="130" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#6c757d" letter-spacing="0.5">I tuoi Simulatori Finanziari</text>
</svg>
